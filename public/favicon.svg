<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A claim (open circle) and the strike that followed it (red arc landing on
       a ringed marker): the story's two recurring marks, on PolitiFact's ink. -->
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="46" y1="0" x2="19" y2="0">
      <stop offset="0.05" stop-color="#ff3355" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff3355"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="#1a1b1f" stroke="#ffffff" stroke-opacity="0.14"/>
  <g transform="translate(0 -4)">
  <path d="M46 37 Q33 4 19 39" fill="none" stroke="url(#fade)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="18" cy="43" r="11.5" fill="none" stroke="#ff3355" stroke-opacity="0.4" stroke-width="3"/>
  <circle cx="18" cy="43" r="6" fill="#ff3355"/>
  <circle cx="47" cy="43" r="6" fill="none" stroke="#f3f1ec" stroke-width="3.5"/>
  </g>
</svg>
